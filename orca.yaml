# Orca project config — per-worktree setup for agent workspaces.
#
# Runs when a worktree is created with `--setup run` (or the app's
# equivalent). The setup logic lives in bin/setup-worktree.sh, which is
# shared with GSD-created worktrees (git.worktree_post_create in
# .gsd/PREFERENCES.md) so both worktree factories provision identical
# workspaces from one source of truth.
#
# Worktree policy for this repo (see docs/agent-worktrees.md):
#   - GSD owns execution worktrees: <repo>/.gsd-worktrees/<id>, created by
#     GSD auto mode, sharing the project's GSD state (full history).
#   - Orca attaches agents/workers to those worktrees via
#     `--worktree path:<repo>/.gsd-worktrees/<id>`; do NOT run GSD workflow
#     commands from orca-managed worktrees under ~/orca/workspaces — they
#     resolve as separate GSD projects (split-brain state).
#
# Deliberately does NOT run migrations: Orca worktrees share nothing with the
# main checkout's dev database, and agents should not mutate shared state
# during setup. Tests boot their own throwaway Postgres testcontainer
# (tests/bootstrap.php), exactly like CI.
scripts:
  setup: |
    set -e
    bash bin/setup-worktree.sh
