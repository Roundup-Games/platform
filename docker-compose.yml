services:
  app:
    # CI (images.yml) pushes this image; deploys pull it
    # (scripts/deploy/homelab.sh pins DEPLOY_TAG=sha-<commit>). The build
    # block stays as an on-host fallback for `docker compose build`.
    image: ghcr.io/roundup-games/platform:${DEPLOY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: roundup-games
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - app_storage:/var/www/html/storage
    ports:
      - "8199:8080"
    # Dependency-aware health (MEM1147): /up checks DB + Redis + cache.
    # curl -f: exit 22 on HTTP >= 400, so the 503-with-check-names
    # response fails the probe (the image ships curl).
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - roundup

  worker:
    image: ghcr.io/roundup-games/platform-worker:${DEPLOY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: roundup-games-worker
    restart: unless-stopped
    # Horizon jobs may run up to 300s (horizon.php production timeout). The
    # compose default grace is 10s, which SIGKILLs mid-run jobs on every
    # deploy — duplicating expensive work when retry_after re-releases them.
    # 5m lets `horizon:terminate` finish current jobs before the stop.
    stop_grace_period: 5m
    env_file:
      - .env.production
    environment:
      # The app service owns migrations + seeding; a second concurrent
      # migrator races the migrations table on every deploy.
      RUN_MIGRATIONS: "0"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - roundup
    depends_on:
      # Wait for the app to be healthy (migrations done) — the list form only
      # orders container START, not readiness, which still raced boot-time
      # queries against a mid-migration schema.
      app:
        condition: service_healthy
    # Worker has no nginx/fpm (stripped in the Dockerfile worker stage), so the
    # image's default HTTP healthcheck always fails with 'unhealthy'. Probe what
    # the worker actually does: Horizon is processing the queue.
    #
    # Gate the probe on the init-complete marker that 99-laravel-init writes
    # when it finishes. Docker runs healthchecks outside s6 ordering, so this
    # artisan command is the one process that could otherwise boot Laravel
    # while the init is still rewriting the config cache — the concurrent
    # booter behind the deploy-window boot ErrorException (PR #80's diagnosis).
    # Before the marker exists the probe is a cheap file test, not an artisan
    # boot; start_period absorbs the init window.
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/laravel-init-complete && php artisan horizon:status 2>/dev/null | grep -qi running"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Nightly data-protection sidecar: pg_dump + app_storage tar + offsite
  # copy + retention (docker/backup/backup.sh). Uses postgres:17-alpine so
  # pg_dump's major matches the server. Restore runbook: header comment of
  # backup.sh (rehearsed 2026-10-26). Heartbeat: set PHARE_CRON_PING_URL in
  # .env.production to wire a Phare cron check (success-only ping).
  backup:
    image: postgres:17-alpine
    container_name: roundup-games-backup
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKUP_KEEP_COUNT: "8"
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/roundup-backup:ro
      - ./docker/backup/crontab:/etc/crontabs/root:ro
      - backup_data:/backups
      - app_storage:/mnt/app-storage:ro
      # Second-medium copy target. Create the share once and set it to
      # "Use cache: no" in unRAID so copies land on the array, not the NVMe
      # the primary backups (and the app data) live on.
      - /mnt/user/roundup-games-backups:/mnt/offsite
    entrypoint: ["/bin/sh", "-c", "crond -f -l 2"]
    networks:
      - roundup

volumes:
  app_storage:
  backup_data:

networks:
  roundup:
    driver: bridge
    # Stable, host-referencable name: Redis and Postgres (Unraid-managed
    # containers on this host) attach to this network so the app resolves
    # them by container name (REDIS_HOST=Redis, DB_HOST=postgresql17) —
    # never by host LAN IP (MEM1147: reboot windows + restart=no caused
    # ~4.9K connection-refused errors). Those containers must also run
    # with --restart unless-stopped. NOTE: docker network connect is
    # runtime state — re-attach after recreating Redis/Postgres on the
    # Unraid side, or add this network to their templates:
    #   docker network connect roundup-games-laravel_roundup Redis
    #   docker network connect roundup-games-laravel_roundup postgresql17
    name: roundup-games-laravel_roundup
