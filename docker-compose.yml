# ── Deployment topology (zero-downtime blue/green) ─────────────────────
#
#   Cloudflare Tunnel (remotely managed, immutable from here)
#     └─> host :8199 — the tunnel's ONE stable origin, forever
#           └─> edge (caddy, never restarts during deploys; config swap +
#                `caddy reload` = lossless traffic flip)
#                 ├─> roundup-games-blue:8080  (service `app`)
#                 └─> roundup-games-green:8080 (service `app-green`,
#                      profile "bluegreen" — exists only during deploys)
#
# Deploys (scripts/deploy/homelab.sh): start the idle slot with the new
# image, health-gate it, flip the edge upstream, retire the old slot, then
# roll the worker off the critical path. Rollback = flip back (or
# `--rollback` to re-run a previous image). The app slots publish NO host
# ports — only the edge does — so the tunnel config never changes.
#
# Worker note: `depends_on` is deliberately ABSENT from the worker. With
# blue/green slots there is no static "the app" service to depend on, and a
# depends_on would resurrect a retired blue slot during a green deploy.
# Start ordering is owned by the deploy script (worker rolls after the
# candidate is healthy, i.e. after migrations); Horizon additionally
# self-heals transient boot races by retrying.

services:
  app:
    # BLUE slot. CI (images.yml) pushes this image; deploys pull it
    # (scripts/deploy/homelab.sh pins DEPLOY_TAG=sha-<commit>). The build
    # block stays as an on-host fallback for `docker compose build`.
    image: ghcr.io/roundup-games/platform:${DEPLOY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: roundup-games-blue
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - app_storage:/var/www/html/storage
    # Dependency-aware health (MEM1147): /up checks DB + Redis + cache.
    # curl -f: exit 22 on HTTP >= 400, so the 503-with-check-names
    # response fails the probe (the image ships curl). start_interval
    # probes every 3s during start_period so "healthy" flips within ~3s
    # of readiness (deploy gate latency), interval 10s keeps steady-state
    # flap detection quick.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    # Graceful retire: nginx drains in-flight requests instead of being
    # SIGKILLed at the default 10s.
    stop_grace_period: 30s
    networks:
      - roundup

  app-green:
    # GREEN slot — identical to `app` except the name. Enabled only via
    # `--profile bluegreen` (the deploy script does this); steady-state
    # commands never see it. restart: unless-stopped keeps it alive across
    # host reboots when it is the live slot.
    image: ghcr.io/roundup-games/platform:${DEPLOY_TAG:-latest}
    container_name: roundup-games-green
    profiles: ["bluegreen"]
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    stop_grace_period: 30s
    networks:
      - roundup

  edge:
    # The one stable origin the Cloudflare Tunnel points at (:8199).
    # caddy:2-alpine. Config lives in ./edge/Caddyfile (runtime state,
    # gitignored — written/reloaded by the deploy script; `caddy reload`
    # swaps the upstream with zero dropped connections). This container
    # never restarts during a deploy, so :8199 never goes dark.
    image: caddy:2-alpine
    container_name: roundup-games-edge
    restart: unless-stopped
    ports:
      - "8199:8199"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    # Site-level liveness: /up through the current upstream. Unhealthy =
    # the live app is down (or booting), which is exactly what operators
    # and the dashboard should see. wget = busybox, present in alpine.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8199/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - roundup

  worker:
    image: ghcr.io/roundup-games/platform-worker:${DEPLOY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: roundup-games-worker
    restart: unless-stopped
    # Horizon jobs may run up to 300s (horizon.php production timeout). The
    # compose default grace is 10s, which SIGKILLs mid-run jobs on every
    # deploy — duplicating expensive work when retry_after re-releases them.
    # 5m lets `horizon:terminate` finish current jobs before the stop.
    stop_grace_period: 5m
    env_file:
      - .env.production
    environment:
      # The app service owns migrations + seeding; a second concurrent
      # migrator races the migrations table on every deploy.
      RUN_MIGRATIONS: "0"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - roundup
    # Worker has no nginx/fpm (stripped in the Dockerfile worker stage), so the
    # image's default HTTP healthcheck always fails with 'unhealthy'. Probe what
    # the worker actually does: Horizon is processing the queue.
    #
    # Gate the probe on the init-complete marker that 99-laravel-init writes
    # when it finishes. Docker runs healthchecks outside s6 ordering, so this
    # artisan command is the one process that could otherwise boot Laravel
    # while the init is still rewriting the config cache — the concurrent
    # booter behind the deploy-window boot ErrorException (PR #80's diagnosis).
    # Before the marker exists the probe is a cheap file test, not an artisan
    # boot; start_period absorbs the init window.
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/laravel-init-complete && php artisan horizon:status 2>/dev/null | grep -qi running"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Nightly data-protection sidecar: pg_dump + app_storage tar + offsite
  # copy + retention (docker/backup/backup.sh). Uses postgres:17-alpine so
  # pg_dump's major matches the server. Restore runbook: header comment of
  # backup.sh (rehearsed 2026-10-26). Heartbeat: set PHARE_CRON_PING_URL in
  # .env.production to wire a Phare cron check (success-only ping).
  backup:
    image: postgres:17-alpine
    container_name: roundup-games-backup
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      BACKUP_KEEP_COUNT: "8"
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/roundup-backup:ro
      - ./docker/backup/crontab:/etc/crontabs/root:ro
      - backup_data:/backups
      - app_storage:/mnt/app-storage:ro
      # Second-medium copy target. Create the share once and set it to
      # "Use cache: no" in unRAID so copies land on the array, not the NVMe
      # the primary backups (and the app data) live on.
      - /mnt/user/roundup-games-backups:/mnt/offsite
    entrypoint: ["/bin/sh", "-c", "crond -f -l 2"]
    networks:
      - roundup

volumes:
  app_storage:
  backup_data:

networks:
  roundup:
    driver: bridge
    # Stable, host-referencable name: Redis and Postgres (Unraid-managed
    # containers on this host) attach to this network so the app resolves
    # them by container name (REDIS_HOST=Redis, DB_HOST=postgresql17) —
    # never by host LAN IP (MEM1147: reboot windows + restart=no caused
    # ~4.9K connection-refused errors). Those containers must also run
    # with --restart unless-stopped. NOTE: docker network connect is
    # runtime state — re-attach after recreating Redis/Postgres on the
    # Unraid side, or add this network to their templates:
    #   docker network connect roundup-games-laravel_roundup Redis
    #   docker network connect roundup-games-laravel_roundup postgresql17
    name: roundup-games-laravel_roundup
