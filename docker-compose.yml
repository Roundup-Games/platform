services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: roundup-games
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - app_storage:/var/www/html/storage
    ports:
      - "8199:8080"
    networks:
      - roundup

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: roundup-games-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # The app service owns migrations + seeding; a second concurrent
      # migrator races the migrations table on every deploy.
      RUN_MIGRATIONS: "0"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - roundup
    depends_on:
      # Wait for the app to be healthy (migrations done) — the list form only
      # orders container START, not readiness, which still raced boot-time
      # queries against a mid-migration schema.
      app:
        condition: service_healthy
    # Worker has no nginx/fpm (stripped in the Dockerfile worker stage), so the
    # image's default HTTP healthcheck always fails with 'unhealthy'. Probe what
    # the worker actually does: Horizon is processing the queue.
    healthcheck:
      test: ["CMD", "sh", "-c", "php artisan horizon:status 2>/dev/null | grep -qi running"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  app_storage:

networks:
  roundup:
    driver: bridge
